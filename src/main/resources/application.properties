spring.application.name=api-gateway
server.port=8080
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Auth Service
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth-service/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1

# Application Service
spring.cloud.gateway.routes[1].id=application-service
spring.cloud.gateway.routes[1].uri=lb://APPLICATION-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/application-service/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1

# Interview Service
spring.cloud.gateway.routes[2].id=interview-service
spring.cloud.gateway.routes[2].uri=lb://INTERVIEW-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/interview-service/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=1