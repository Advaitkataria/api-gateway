spring.application.name=api-gateway
server.port=8080
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.routes[0].id=applicationtracker
spring.cloud.gateway.routes[0].uri=lb://APPLICATIONTRACKER
spring.cloud.gateway.routes[0].predicates[0]=Path=/applicationtracker/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[1].id=feign-demo
spring.cloud.gateway.routes[1].uri=lb://FEIGN-PROJECT
spring.cloud.gateway.routes[1].predicates[0]=Path=/feign-project/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1