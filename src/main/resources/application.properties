spring.application.name=api-gateway
server.port=8080
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.routes[0].id=applicationtracker
spring.cloud.gateway.routes[0].uri=lb://APPLICATIONTRACKER
spring.cloud.gateway.routes[0].predicates[0]=Path=/applicationtracker/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1